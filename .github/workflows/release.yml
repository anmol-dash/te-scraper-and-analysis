# Release: tag v*.*.* → matrix Tauri build → GitHub Release + latest.json + .sig files
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Verify tag matches package.json and tauri.conf.json
        run: ./scripts/sync-version.sh --check

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS .dmg (Intel + Apple Silicon) built on Apple
          # Silicon; the GitHub-hosted Intel (macos-13) runner is too starved to
          # rely on. Windows .exe builds natively.
          - os: macos-14
            platform: darwin-universal
            tauri_args: "--target universal-apple-darwin"
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            platform: windows-x86_64
            tauri_args: ""
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-release-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-release-${{ runner.os }}-

      - name: Cache Python sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecar-${{ matrix.platform }}-${{ hashFiles('backend/**/*.py', 'backend/pyinstaller.spec', 'backend/requirements.txt', 'requirements.txt', '*.py', '*.pyx') }}

      - name: Build Python sidecar (Unix, universal2)
        if: runner.os != 'Windows' && steps.sidecar-cache.outputs.cache-hit != 'true'
        env:
          PYINSTALLER_TARGET_ARCH: universal2
        run: |
          pip install pyinstaller
          bash scripts/build-python.sh

      - name: Build Python sidecar (Windows)
        if: runner.os == 'Windows' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          pip install pyinstaller
          powershell -ExecutionPolicy Bypass -File scripts/build-python.ps1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: matrix.platform == 'darwin-universal'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Unsigned installers: no Apple/Windows code-signing certs are configured.
      # Passing the cert env vars as empty strings makes Tauri attempt (and fail)
      # a keychain import, so they are intentionally omitted here.
      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Stage platform installer
        run: node scripts/prepare-platform-release.mjs ${{ matrix.platform }} ${{ matrix.bundle_dir }} staging

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: staging/

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*

      - name: Release metadata (draft/prerelease)
        id: meta
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ "$V" == *-* ]]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release_notes.md from annotated tag
        run: |
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release_notes.md || true

      - name: Upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Only the user-facing installers (.dmg / .exe). The updater is unused,
          # so no latest.json/.sig is attached. GitHub still auto-adds the
          # "Source code" archives — those cannot be removed via the API.
          mapfile -t BINS < <(find artifacts -type f -path '*/assets/*' ! -name '*.sig' | sort)
          if [[ "${#BINS[@]}" -lt 1 ]]; then
            echo "::error::No release binaries found under artifacts/**/assets/ — check platform build logs"
            exit 1
          fi
          EXTRA=( )
          if [[ "${{ steps.meta.outputs.draft }}" == "true" ]]; then EXTRA+=( --draft ); fi
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then EXTRA+=( --prerelease ); fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --verify-tag \
            "${EXTRA[@]}" \
            "${BINS[@]}"

  report-failure:
    needs: [preflight, build, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::Release pipeline failed for tag ${GITHUB_REF_NAME}."
          echo ""
          echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Check the individual job logs above for the specific failure."
          echo "Common causes:"
          echo "  - Missing TAURI_SIGNING_PRIVATE_KEY secret"
          echo "  - Python sidecar build error (PyInstaller spec or import issue)"
          echo "  - Frontend build error (TypeScript / pnpm)"
          echo "  - Version mismatch between tag, package.json, and tauri.conf.json"
          exit 1
